[package]
name = "sukari"
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Shared append-segment Raft state storage for noraft-based applications"
homepage = "https://github.com/sile/sukari"
repository = "https://github.com/sile/sukari"
readme = "README.md"
categories = ["algorithms", "database-implementations"]
keywords = ["raft", "storage", "wal", "multi-raft"]

[workspace]
exclude = ["fuzz"]

[dependencies]
noraft = "0.7"
nojson = "0.3"

[dev-dependencies]
noprop = "0.2"
