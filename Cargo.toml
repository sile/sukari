[package]
name = "sukari"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Shared segmented Raft log storage engine for multi-Raft workloads"
homepage = "https://github.com/sile/sukari"
repository = "https://github.com/sile/sukari"
readme = "README.md"
categories = ["algorithms", "database-implementations"]
keywords = ["raft", "storage", "wal", "multi-raft"]

[workspace]
members = ["pbt"]
exclude = ["fuzz"]

[workspace.dependencies]
# Core Raft state machine and protocol types.
noraft = "0.6"
# Node registry JSON parsing and formatting.
nojson = "0.3"

[dependencies]
noraft = { workspace = true }
nojson = { workspace = true }
